apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/process-agent-sandbox/storefront-deploy.git
    targetRevision: main
    path: envs/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: storefront-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
